<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f4f0">
<title>Re-Ag? Arcade — Jumper</title>
<style>
:root{--page:#f5f4f0;--surface:#fff;--ink:#242520;--muted:#777970;--line:#dedfd8;--accent:#a6aa91}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;padding:18px;touch-action:pan-y}
.wrap{width:min(100%,560px)}header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
a{color:inherit;text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface)}
.brand{font-weight:800;font-size:22px;letter-spacing:-1px}.brand span{color:#777d61}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 10px 34px rgba(28,30,22,.055)}
.topline{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 12px;font-size:12px;color:var(--muted)}
.topline strong{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#f7f7f1}
canvas{display:block;width:100%;height:auto;aspect-ratio:360/560;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(247,247,241,.84);text-align:center;padding:25px}
.overlay[hidden]{display:none}.panel{max-width:270px}.panel h1{font-size:26px;letter-spacing:-1px;margin:0 0 8px}.panel p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}
button{font:inherit;cursor:pointer}.primary{border:0;border-radius:10px;background:#858d70;color:white;padding:11px 20px;font-weight:700}
.controls{display:flex;gap:12px;justify-content:center;margin-top:13px}
.control{width:50%;height:54px;border:1px solid var(--line);border-radius:13px;background:var(--surface);font-size:22px;color:var(--ink);touch-action:none;user-select:none}
.hint{text-align:center;color:var(--muted);font-size:11px;margin:12px 0 3px}
@media(prefers-color-scheme:dark){:root{--page:#171815;--surface:#22241f;--ink:#eeeee8;--muted:#a5a79c;--line:#393c34;background:var(--page);color:var(--ink)}.stage{background:#20231d}.overlay{background:rgba(32,35,29,.86)}}
</style>
</head>
<body>
<div class="wrap">
<header><a href="./index.html">← Back to Re-Ag?</a><div class="brand">Re-Ag<span>?</span> Arcade</div></header>
<section class="card">
<div class="topline"><span>JUMPER · OFFLINE ARCADE</span><span>BEST <strong id="best">0</strong></span></div>
<div class="stage">
<canvas id="game" width="360" height="560" aria-label="Re-Ag Jumper game"></canvas>
<div class="overlay" id="overlay"><div class="panel"><h1 id="overlayTitle">Re-Ag? Jumper</h1><p id="overlayText">Keep bouncing. Land on platforms, climb higher, and don't fall. This game works offline after its first successful load.</p><button class="primary" id="start">Play</button></div></div>
</div>
<div class="controls"><button class="control" id="left" aria-label="Move left">←</button><button class="control" id="right" aria-label="Move right">→</button></div>
<p class="hint">Use ← →, A / D, or touch controls. Best score is saved on this device.</p>
</section>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=360,H=560,overlay=document.getElementById('overlay');
const bestEl=document.getElementById('best');
let best=Number(localStorage.getItem('reag-jumper-best')||0);bestEl.textContent=best;
let player,platforms,camera,score,playing=false,raf=0,last=0,keys={left:false,right:false};
const rand=(a,b)=>a+Math.random()*(b-a);
function makePlatform(y){return{x:rand(8,W-76),y,w:rand(48,76),h:9}}
function reset(){
 score=0;camera=0;player={x:W/2,y:H-100,vx:0,vy:-8.5,r:13};
 platforms=[{x:W/2-42,y:H-48,w:84,h:10}];
 let y=H-125;while(y>-H*2){platforms.push(makePlatform(y));y-=rand(55,88)}
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#f7f7f1';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(130,137,109,.10)';ctx.lineWidth=1;
 for(let y=0;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 platforms.forEach(p=>{const py=p.y+camera;if(py<-20||py>H+20)return;ctx.fillStyle='#a6aa91';ctx.beginPath();ctx.roundRect(p.x,py,p.w,p.h,5);ctx.fill();ctx.fillStyle='rgba(52,56,43,.12)';ctx.fillRect(p.x+5,py+6,p.w-10,2)});
 const py=player.y+camera;
 ctx.fillStyle='#747d5d';ctx.beginPath();ctx.arc(player.x,py,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x-4,py-2,2.4,0,Math.PI*2);ctx.arc(player.x+4,py-2,2.4,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#34382b';ctx.fillRect(player.x-3,py+5,6,2);
 ctx.fillStyle='#34382b';ctx.font='700 13px system-ui';ctx.fillText('RE-AG?  /  '+score,14,24);
}
function start(){reset();playing=true;overlay.hidden=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){
 playing=false;cancelAnimationFrame(raf);
 if(score>best){best=score;localStorage.setItem('reag-jumper-best',best);bestEl.textContent=best}
 document.getElementById('overlayTitle').textContent='Run over!';
 document.getElementById('overlayText').textContent='You climbed '+score+' points. Best: '+best+'. Ready for another run?';
 document.getElementById('start').textContent='Play again';overlay.hidden=false;draw();
}
function loop(now){
 if(!playing)return;
 const dt=Math.min((now-last)/16.67,2);last=now;
 const oldY=player.y;
 player.vx=keys.left?-4.1:keys.right?4.1:player.vx*.82;
 player.x+=player.vx*dt;player.vy+=.34*dt;player.y+=player.vy*dt;
 if(player.x<-player.r)player.x=W+player.r;if(player.x>W+player.r)player.x=-player.r;
 if(player.vy>0)for(const p of platforms){
  const sy=p.y+camera;
  if(oldY+camera+player.r<=sy+3&&player.y+camera+player.r>=sy&&player.x>p.x-8&&player.x<p.x+p.w+8){player.vy=-8.7;break}
 }
 if(player.y+camera<H*.36){const shift=H*.36-(player.y+camera);camera+=shift;score=Math.max(score,Math.floor(camera/10))}
 platforms=platforms.filter(p=>p.y+camera<H+30);
 let highest=Math.min(...platforms.map(p=>p.y));
 while(highest+camera>-20){highest-=rand(55,88);platforms.push(makePlatform(highest))}
 if(player.y+camera>H+35){end();return}
 draw();raf=requestAnimationFrame(loop);
}
document.getElementById('start').addEventListener('click',start);
function bind(id,key){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};
 el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up);
}
bind('left','left');bind('right','right');
window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault()}});
window.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
reset();draw();
})();
</script>
</body>
</html>
